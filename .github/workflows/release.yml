name: Release

# Push a tag like v0.1.0 (matching Cargo.toml) to build binaries, publish a GitHub
# release, update the Homebrew tap and publish to crates.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          want="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $want"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="whoq-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/whoq" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: whoq-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat whoq-*.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes whoq-*.tar.gz SHA256SUMS

  homebrew:
    needs: release
    # Pre-releases (v1.2.0-rc1) stay off Homebrew.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}

  crates-io:
    needs: release
    runs-on: ubuntu-latest
    # Trusted publishing: crates.io trusts this workflow in this repo and hands it a
    # short-lived token, so no crates.io token is stored in GitHub.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if already published
        id: check
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -A "whoq-release ($GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/whoq/${GITHUB_REF_NAME#v}")"
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.check.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
