[package]
name = "whoq"
version = "0.1.7"
edition = "2024"
description = "RDAP-first WHOIS for humans and agents: structured output, MCP server, watch mode, bulk IP enrichment, live DNS/mail/TLS checks"
license = "MIT"
repository = "https://github.com/honzabit/whoq"
homepage = "https://github.com/honzabit/whoq"
readme = "README.md"
keywords = ["whois", "rdap", "dns", "mcp", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["proka"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dirs = "7.0.0"
futures = "0.3.34"
hickory-resolver = "0.26.3"
idna = "1.1.0"
ipnet = "2.12.2"
psl = "2.1.254"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18.1"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["test-util"] }
